[workspace]
members = [
    "crates/core",
    "crates/tag",
    "crates/parser",
    "crates/duel",
    "crates/devtools",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Obwiler"]
license = "MIT"
repository = "https://github.com/Obwiler/ObwilerCardMaker"

[workspace.metadata]
rust-version = "1.75"

[package]
name = "cardmaker"
version.workspace = true
description = "《对峙》卡牌编辑器"
authors = ["Obwiler"]
edition.workspace = true

[lib]
name = "cardmaker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde.workspace = true
serde_json.workspace = true
tag = { path = "crates/tag" }
parser = { path = "crates/parser" }
duel = { path = "crates/duel" }
devtools = { path = "crates/devtools" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
